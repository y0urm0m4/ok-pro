name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # The server key is restricted to /home/deploy/deploy.sh:
      # the only accepted "command" is the commit SHA to deploy.
      # It builds separately, swaps atomically, pm2 reload, health check.
      - name: Deploy ${{ github.sha }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" "$GITHUB_SHA"

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 \
            --resolve "okpro.space:443:$SSH_HOST" \
            -w "https://okpro.space -> %{http_code}\n" https://okpro.space/

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
